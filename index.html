<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Zyntra AI</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

</head>

<body>
<div class="background">

    <div class="blur blur1"></div>
    <div class="blur blur2"></div>
    <div class="grid"></div>

</div>
<header class="navbar">

<div class="logo">
✦ Zyntra <span>AI</span>
</div>

<nav>

<a class="active">Home</a>

<a>Tools</a>

<a>Pricing</a>

<a>About</a>

</nav>

<div class="right">

<button class="signin">Sign In</button>

<button class="start">Get Started</button>

</div>

</header>

<section class="hero">

    <div class="hero-left">

        <span class="tag">
            ONE PLACE. EVERY POSSIBILITY.
        </span>

        <h1>
            Your ideas,<br>
            <span>powered by AI.</span>
        </h1>

        <p>
            Chat, create images, create videos, learn faster,
            write better and build your next big idea —
            all with Zyntra AI.
        </p>

        <div class="hero-search">

            <input
                type="text"
                placeholder="Ask Zyntra AI anything..."
            >

            <button>
                Ask AI →
            </button>

        </div>

    </div>

    <div class="hero-right">

        <div class="glow-circle">

            <div class="star">
                ✦
            </div>

        </div>

    </div>

</section>

<script src="script.js"></script>

</body>
</html>
